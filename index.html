<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div id="display" class="display">
        <span id="equation">0</span>
        <span id="pre-result"></span>
      </div>

      <div class="buttons">
        <div class="btn clear">AC</div>
        <button
          class="btn"
          id="theme-toggle"
          type="button"
          aria-label="Увімкнути темну тему"
          aria-pressed="false"
        >
          🌙
        </button>
        <div class="btn operator">%</div>
        <div class="btn operator">/</div>

        <div class="btn">7</div>
        <div class="btn">8</div>
        <div class="btn">9</div>
        <div class="btn operator">*</div>

        <div class="btn">4</div>
        <div class="btn">5</div>
        <div class="btn">6</div>
        <div class="btn operator">-</div>

        <div class="btn">1</div>
        <div class="btn">2</div>
        <div class="btn">3</div>
        <div class="btn operator">+</div>

        <div class="btn">0</div>
        <div class="btn">,</div>
        <div class="btn backspace">⌫</div>
        <div class="btn equal">=</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
